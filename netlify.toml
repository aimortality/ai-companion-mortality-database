[build]
  # build.py renders templates/ + data/mortality-data.json into dist/ (and copies data/, docs/,
  # and the static pages). The audit then checks the BUILT site and fails the deploy on any
  # FAIL, so a page that disagrees with canonical never publishes -- the site stays on its last
  # good deploy. dist/ is build output: not in git, rebuilt from scratch every time.
  publish = "dist"
  command = "pip install -r requirements.txt && python3 build.py && python3 scripts/audit-surfaces.py --no-build"

[build.environment]
  PYTHON_VERSION = "3.12"

# /export.js was a client-side export module that no page loaded; it was removed 2026-09-29.
# It advertised /api/v1/* endpoints that never existed. Anyone following an old link to either
# lands on the real data files -- the same place the site nav's "Data files" link goes -- rather
# than a dead end. 301: the removal is permanent and so is the replacement.
[[redirects]]
  from = "/export.js"
  to = "/data/README.md"
  status = 301

[[redirects]]
  from = "/api/v1/*"
  to = "/data/README.md"
  status = 301

# Redirect all ai-death.com traffic to aimortality.org
[[redirects]]
  from = "https://ai-death.com/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ai-death.com/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

# Redirect all chatbotdeaths.org traffic to aimortality.org
[[redirects]]
  from = "https://chatbotdeaths.org/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.chatbotdeaths.org/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

# Redirect www to non-www for primary domain
[[redirects]]
  from = "https://www.aimortality.org/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
