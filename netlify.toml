[build]
  publish = "src"
  # data/ and docs/ live outside the publish dir; copy them in at build time so
  # /data/mortality-data.json and /docs/methodology.md are served (single source, no dup).
  command = "cp -r data src/data && cp -r docs src/docs"

# Redirect all ai-death.com traffic to aimortality.org
[[redirects]]
  from = "https://ai-death.com/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ai-death.com/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

# Redirect all chatbotdeaths.org traffic to aimortality.org
[[redirects]]
  from = "https://chatbotdeaths.org/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.chatbotdeaths.org/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

# Redirect www to non-www for primary domain
[[redirects]]
  from = "https://www.aimortality.org/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
