[build]
  # build.py renders templates/ + data/mortality-data.json into dist/ (and copies data/, docs/,
  # and the static pages). The audit then checks the BUILT site and fails the deploy on any
  # FAIL, so a page that disagrees with canonical never publishes -- the site stays on its last
  # good deploy. dist/ is build output: not in git, rebuilt from scratch every time.
  publish = "dist"
  command = "pip install -r requirements.txt && python3 build.py && python3 scripts/audit-surfaces.py --no-build"

[build.environment]
  PYTHON_VERSION = "3.12"

# /export.js was a client-side export module that no page loaded; it was removed 2026-09-29.
# It advertised /api/v1/* endpoints that never existed. Anyone following an old link to either
# lands on the real data files -- the same place the site nav's "Data files" link goes -- rather
# than a dead end. 301: the removal is permanent and so is the replacement.
[[redirects]]
  from = "/export.js"
  to = "/data/README.md"
  status = 301

[[redirects]]
  from = "/api/v1/*"
  to = "/data/README.md"
  status = 301

# The two docs were one client-rendered page switched by ?doc=; they are now two static pages.
# Old citations keep working. Query rules sit above the domain rules below.
[[redirects]]
  from = "/methodology"
  query = { doc = "verification-standards" }
  to = "/verification-standards"
  status = 301
  force = true

[[redirects]]
  from = "/methodology.html"
  query = { doc = "verification-standards" }
  to = "/verification-standards"
  status = 301
  force = true

# Redirect all chatbotdeaths.org traffic to aimortality.org
[[redirects]]
  from = "https://chatbotdeaths.org/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.chatbotdeaths.org/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

# Redirect www to non-www for primary domain
[[redirects]]
  from = "https://www.aimortality.org/*"
  to = "https://aimortality.org/:splat"
  status = 301
  force = true

# Redirects live here only. src/_redirects (processed BEFORE this file) duplicated the rules
# above and silently shadowed them; it was removed so there is one source of truth.

# URL contract. Netlify's Pretty URLs serve /page for page.html and rewrite internal "page.html"
# links to "/page" at deploy, so dist/ links say page.html while the live site says /page; both
# forms return 200. It was on via the dashboard; set here so the repo is the source of truth.
# New pages: emit name.html, link name.html. Canonical URLs are extensionless.
[build.processing.html]
  pretty_urls = true

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # Deprecated; the legacy XSS auditor it enabled could itself leak data. 0 = off (OWASP guidance).
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Content-Security-Policy. Edit this deliberately; the e2e spec tests/e2e/csp.spec.ts reads
    # this exact line, and the audit (check_inline_scripts) keeps inline scripts out of the pages.
    #  - 'unsafe-inline' is in style-src ONLY because pages still carry inline <style> blocks and
    #    style="" attributes. It comes out when those do.
    #  - The Google hosts are the ones GA4 needs: the gtag.js loader (googletagmanager.com) and
    #    its beacons (google-analytics.com, analytics.google.com).
    #  - Any new third-party host must be added here on purpose, never worked around.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
