<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Companion Mortality Database</title>
  <style>
    body {
      font-family: Georgia, 'Times New Roman', Times, serif;
      background: #ffffff;
      color: #000000;
      margin: 40px;
      line-height: 1.5;
      font-size: 14px;
    }

    .crisis {
      background: #000000;
      color: #ffffff;
      padding: 8px;
      margin: -40px -40px 30px -40px;
      font-size: 13px;
      text-align: center;
    }

    .crisis a {
      color: #ffffff;
      font-weight: bold;
    }

    h1 {
      font-size: 24px;
      font-weight: normal;
      margin: 0 0 5px 0;
      border-bottom: 2px solid #000000;
      padding-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      margin: 0 0 20px 0;
      color: #666666;
    }

    .meta {
      font-size: 12px;
      margin: 0 0 30px 0;
      color: #666666;
      border-bottom: 1px solid #cccccc;
      padding-bottom: 15px;
    }

    /* SVG VISUALIZATIONS - exactly like the original */
    .viz-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 40px;
      margin: 40px 0;
      padding: 30px 0;
      border-top: 1px solid #000000;
      border-bottom: 1px solid #000000;
    }

    .viz-section {
      min-height: 200px;
    }

    .viz-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      color: #666666;
    }

    /* NAVIGATION - basic HTML style */
    .nav {
      margin: 30px 0;
      padding: 10px 0;
      border-top: 1px solid #cccccc;
      border-bottom: 1px solid #cccccc;
    }

    .nav a {
      color: #0000ee;
      text-decoration: underline;
      margin-right: 20px;
      font-size: 13px;
      cursor: pointer;
    }

    .nav a:visited {
      color: #551a8b;
    }

    .nav a.active {
      color: #000000;
      text-decoration: none;
      font-weight: bold;
    }

    /* TABLES - plain HTML table aesthetic */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 8px 12px 8px 0;
      border-bottom: 2px solid #000000;
      font-weight: bold;
      font-size: 12px;
    }

    td {
      padding: 10px 12px 10px 0;
      border-bottom: 1px solid #cccccc;
      vertical-align: top;
    }

    .platform-name {
      font-weight: bold;
    }

    .death-marker {
      color: #cc0000;
      margin-right: 5px;
    }

    .safe-marker {
      color: #006600;
      margin-right: 5px;
    }

    ul {
      margin: 5px 0 0 0;
      padding: 0;
      list-style: none;
      font-size: 12px;
      color: #666666;
    }

    li {
      margin-bottom: 3px;
    }

    /* CARDS - simple boxes */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin: 20px 0;
    }

    .card {
      border: 1px solid #000000;
      padding: 15px;
      background: #f5f5f5;
    }

    .card-title {
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .card-number {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .card-meta {
      font-size: 12px;
      line-height: 1.6;
      color: #666666;
    }

    /* TIMELINE - simple list */
    .timeline {
      margin: 20px 0;
    }

    .timeline-item {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #cccccc;
    }

    .timeline-date {
      font-size: 12px;
      color: #666666;
      margin-bottom: 5px;
    }

    .timeline-name {
      font-weight: bold;
      margin-bottom: 3px;
    }

    .timeline-meta {
      font-size: 12px;
      color: #666666;
    }

    /* METHODOLOGY */
    .methodology {
      background: #f5f5f5;
      border: 1px solid #000000;
      padding: 20px;
      margin: 40px 0;
      font-size: 13px;
      line-height: 1.7;
    }

    .methodology h3 {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0 0 15px 0;
    }

    .methodology p {
      margin: 0 0 12px 0;
    }

    .methodology ul {
      margin: 10px 0 10px 20px;
      padding: 0;
      list-style: disc;
      color: #000000;
    }

    .methodology li {
      margin-bottom: 5px;
    }

    /* FOOTER */
    .footer {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid #000000;
      font-size: 12px;
      color: #666666;
      text-align: center;
    }

    .footer p {
      margin: 5px 0;
    }

    /* SECTION TITLE */
    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin: 30px 0 15px 0;
      padding-bottom: 5px;
      border-bottom: 1px solid #000000;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      margin: 30px 0;
      border: 2px solid #000000;
    }

    .stat {
      border-right: 1px solid #000000;
      padding: 20px;
      text-align: center;
      background: #ffffff;
    }

    .stat:last-child {
      border-right: none;
    }

    .stat-number {
      font-size: 36px;
      font-weight: normal;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #666666;
    }

    @media (max-width: 768px) {
      body {
        margin: 20px;
      }

      .crisis {
        margin: -20px -20px 20px -20px;
      }

      .viz-container,
      .card-grid,
      .stats {
        grid-template-columns: 1fr;
      }

      .nav a {
        display: block;
        margin: 5px 0;
      }
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #666666;
    }
  </style>
</head>
